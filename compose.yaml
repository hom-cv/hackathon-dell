name: blackbox-demo
services:
  mongodb:
    image: mongo:8.0.30@sha256:4a0f30875898413139bec44c73c02a05fed172578de65b644dcdcee143ae7306
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Run scripts/configure.py first}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run scripts/configure.py first}
      MONGO_APP_USER: ${MONGO_APP_USER:?Run scripts/configure.py first}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Run scripts/configure.py first}
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/01-app-user.js:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval '
          db = db.getSiblingDB("admin");
          db.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD);
          quit(db.runCommand({ping: 1}).ok === 1 ? 0 : 1)'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: shop
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DEMO_RUN_ID: ${DEMO_RUN_ID:-local}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-inventory-local}
      GIT_SHA: ${GIT_SHA:-unknown}
      DETECTION_INTERVAL_SECONDS: ${DETECTION_INTERVAL_SECONDS:-2}
    ports:
      - "${HTTP_HOST:-127.0.0.1}:${HTTP_PORT:-8000}:8000"
      # A separate bridge-only binding lets the policy-constrained NemoClaw sandbox
      # reach the same API while preserving the operator's loopback URL.
      - "${AGENT_HTTP_HOST:-127.0.0.1}:${AGENT_HTTP_PORT:-8001}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mongo_data:
