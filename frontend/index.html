<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory | Blackbox</title>
  <link rel="icon" href="/static/assets/icons/package.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/"><img src="/static/assets/icons/package.svg" alt="" width="22" height="22">Blackbox <span>Inventory demo</span></a>
    <span id="connection" class="connection" role="status"><span class="dot"></span><span id="connection-label">Connecting</span></span>
  </header>
  <main>
    <div class="page-heading"><div><p class="eyebrow">WORKSPACE / SHOP</p><h1>Inventory</h1></div><button id="add-item" class="primary" type="button"><img src="/static/assets/icons/plus.svg" alt="">Add item</button></div>
    <section class="summary" aria-label="Inventory totals">
      <div><span>Total items</span><strong id="total-items">--</strong></div>
      <div><span>Units available</span><strong id="total-stock">--</strong></div>
      <div><span>Out of stock</span><strong id="out-of-stock">--</strong></div>
    </section>
    <div class="toolbar">
      <label class="search"><img src="/static/assets/icons/search.svg" alt=""><input id="search" type="search" placeholder="Search items or SKU" aria-label="Search items or SKU"></label>
      <div class="toolbar-actions"><select id="stock-filter" aria-label="Stock status"><option value="all">All stock</option><option value="available">In stock</option><option value="low">Low stock</option><option value="out">Out of stock</option></select><button id="refresh" class="icon-button" type="button" title="Refresh inventory" aria-label="Refresh inventory"><img src="/static/assets/icons/refresh-cw.svg" alt=""></button></div>
    </div>
    <p id="notice" class="notice" role="status"></p>
    <div class="table-wrap">
      <table>
        <thead><tr><th scope="col">Item</th><th scope="col">SKU</th><th scope="col">Status</th><th scope="col" class="number">Stock</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead>
        <tbody id="inventory"><tr><td colspan="5" class="empty">Loading inventory...</td></tr></tbody>
      </table>
    </div>
    <footer class="table-footer"><span id="result-count">-- items</span><span id="last-updated">Awaiting connection</span></footer>
  </main>
  <dialog id="item-dialog">
    <form id="item-form">
      <div class="dialog-heading"><h2 id="dialog-title">Add item</h2><button id="close-dialog" class="icon-button" type="button" title="Close" aria-label="Close"><img src="/static/assets/icons/x.svg" alt=""></button></div>
      <label>Item name<input id="item-name" name="name" required maxlength="100" autocomplete="off"></label>
      <label>SKU<input id="item-sku" name="sku" required maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_\-]*" autocomplete="off" placeholder="e.g. KEY-006"></label>
      <label>Stock<input id="item-stock" name="stock" type="number" required min="0" max="1000000" step="1" value="0"></label>
      <p id="form-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button id="cancel-dialog" type="button">Cancel</button><button id="save-item" class="primary" type="submit">Add item</button></div>
    </form>
  </dialog>
  <template id="item-row">
    <tr>
      <td><div class="item-name"><span class="item-icon"><img alt="" width="22" height="22"></span><span class="name"></span></div></td>
      <td class="sku"></td><td><span class="stock-status"></span></td><td class="number stock"></td>
      <td class="actions"><button class="icon-button edit-item" type="button"><img src="/static/assets/icons/pencil.svg" alt=""></button></td>
    </tr>
  </template>
</body>
</html>
